[project]
name = "rnd"
version = "0.1.0"
description = "Add your description here"
readme = "../README.md"
requires-python = ">=3.11,<3.13"

dependencies = [
  "einops>=0.8.1",
  "huggingface-hub>=1.1.7",
  "jupyter>=1.1.1",
  "jupytext>=1.18.1",
  "lap>=0.5.13,<0.6",

  "mediapipe>=0.10; sys_platform == 'linux'",
  "mediapipe-silicon>=0.9.2.1; sys_platform == 'darwin' and platform_machine == 'arm64'",

  "numpy>=2,<3",
  "opencv-python>=4.12.0.88,<5",
  "pycocotools>=2.0.11",
  "python-dotenv>=1.0.0",
  "questionary>=2.1.1",
  "scikit-learn>=1.7.2,<2",
  "scipy>=1.15.3,<2",

  "torch>=2.6,<2.7",
  "torch-geometric>=2.7.0,<3",
  "torchvision>=0.21,<0.22",

  "tqdm>=4.67.1",
  "transformers>=5.9.0",
  "typer>=0.12.0",
  "ultralytics>=8.3.234",
  "zarr>=2.18.0,<3",
  "zstandard>=0.23.0",
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", marker = "sys_platform == 'darwin'" },
  { index = "pytorch-cu124", marker = "sys_platform == 'linux'" },
]

torchvision = [
  { index = "pytorch-cpu", marker = "sys_platform == 'darwin'" },
  { index = "pytorch-cu124", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv]
environments = ["sys_platform == 'linux'", "sys_platform == 'darwin'"]
